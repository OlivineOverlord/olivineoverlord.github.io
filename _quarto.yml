project:
  type: website
  output-dir: _site

website:
  title: "Joshua Shea"
  description: "Joshua Shea — Postdoctoral researcher in igneous geochemistry, University of Cambridge."
  site-url: https://olivineoverlord.github.io
  repo-url: https://github.com/olivineoverlord/olivineoverlord.github.io
  favicon: images/favicon.svg
  open-graph: true
  twitter-card: true

  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: posts.qmd
        text: Notes
      - href: students.qmd
        text: Students
      - href: cv.qmd
        text: CV
    right:
      - icon: github
        href: https://github.com/olivineoverlord
        aria-label: GitHub
      - text: "ORCID"
        href: https://orcid.org/0000-0000-0000-0000  # <-- replace with your ORCID
      - text: "Scholar"
        href: https://scholar.google.com/citations?user=YOUR_ID  # <-- replace
      - icon: envelope
        href: mailto:joshuajshea@gmail.com
        aria-label: Email

  page-footer:
    left: "© 2026 Joshua Shea"
    center: "Built with [Quarto](https://quarto.org)"
    right: "Last updated {{< meta date-modified >}}"

format:
  html:
    theme:
      light: [cosmo, theme.scss]
    css: styles.css
    toc: true
    toc-location: right
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    fig-cap-location: bottom
    citations-hover: true
    footnotes-hover: true
    grid:
      sidebar-width: 250px
      body-width: 760px
      margin-width: 280px
      gutter-width: 1.5rem

bibliography: references.bib

execute:
  freeze: auto
